<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Json JavaScript Course</title>
</head>
<body>
    <button id='addButton'> Get User</button>
    <button id='testButton'> Test map</button>
    <div id="output"></div>

  <script>
    const addButton = document.getElementById('addButton').addEventListener('click', addJSON);
    const testButton = document.getElementById('testButton').addEventListener('click', tester);
    
    function tester() {
      let tempArray = [4,5,6,7,9,122];
      console.log(tempArray);
      const html = tempArray.map(function(val,i) {
        return '<li>' + i + ' = ' + (val * 2)+ '</li>';
      })
      console.log(html.join(''));
      output.innerHTML = '<ul>' + html.join("") + '</ul>';
    }

    String.prototype.capitalize = function() {
      return this.charAt(0).toUpperCase() + this.slice(1);
    }
    const output = document.querySelector('#output');



    function addJSON() {
      const url ="https://randomuser.me/api/?results=50";
      output.innerHTML = '';
      fetch(url).then(function(response) {
        return response.json()
      }).then(function(data) {
        let people = data.results;
        console.log(people);
      return people.map(function(val,i) {
        let div = document.createElement('div');
        let img = document.createElement('img');
        let span = document.createElement('span');
        let firstName = val.name.first.capitalize();
        let lastName = val.name.last.capitalize();
        img.src = val.picture.thumbnail;
        span.innerHTML = (i + 1) + '. ' + firstName + ' ' + lastName;
        div.appendChild(span);
        div.appendChild(img);
        output.appendChild(div);
      })

    }).catch(function(error) {
      console.log(error);
    });
    }
</script>
</body>
</html>
