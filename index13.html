<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Json JavaScript Course</title>
</head>
<body>
    <button id='addButton'> Get User</button>
    <div id="output"></div>

  <script>
    const addButton = document.getElementById('addButton').addEventListener('click', addJSON);

    const output = document.querySelector('#output');

    function addJSON() {
      // create a google sheet and publish it to the web, then copy the id and paste it in the url below
      const id = '1h4T989LuqTvXSQcnvBrLANsSMHykvTttIKPXPQ_8HlE';
      const url ="https://spreadsheets.google.com/feeds/list/" + id + "/od6/public/values?alt=json"; 
      console.log(url);
      
      output.innerHTML = '';
      fetch(url).then(function(response) {
        return response.json()
      }).then(function(data) {
        let entry = data.feed.entry;
        for (let x = 0; x < entry.length; x++) {
          let email = entry[x].gsx$email.$t;
          let id = entry[x].gsx$id.$t;
          let first = entry[x].gsx$firstname.$t;
          let last = entry[x].gsx$lastname.$t;
          output.innerHTML += '<div>' + first + '. ' + last + ' ' + email + ' - ' + id + '</div>';
          console.log(email);
          
        }
      })
      .catch(function(error) {
        console.log(error);
      });
    }
</script>
</body>
</html>
